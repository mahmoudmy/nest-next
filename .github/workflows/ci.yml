name: Foundation CI
on:
  push:
    branches: [main, feat/qms-platform-foundation]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_USER: qms
          POSTGRES_PASSWORD: qms_ci_only
          POSTGRES_DB: qms_test
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U qms -d qms_test' --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://qms:qms_ci_only@localhost:5432/qms_test
      APP_ORIGIN: http://localhost:3000
      API_INTERNAL_URL: http://localhost:3001
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: qms-local
      S3_ACCESS_KEY_ID: qms_local
      S3_SECRET_ACCESS_KEY: qms_local_secret_only
      SEED_ADMIN_EMAIL: admin@example.test
      SEED_ADMIN_PASSWORD: CI-only-password-837462
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - run: docker compose up -d minio minio-init
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec vitest run --config vitest.integration.config.ts
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-pnpm-lockfile
          path: pnpm-lock.yaml
