name: Resolve initial dependency lock
on:
  push:
    branches: [feat/qms-platform-foundation]
    paths: [.github/workflows/bootstrap-lock.yml]
permissions:
  contents: write
jobs:
  lock:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/qms-platform-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/qms-platform-foundation
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Resolve metadata without executing package scripts
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Commit only the resolved lockfile to the approved feature branch
        run: |
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: commit package-manager-resolved pnpm lockfile'
          git push origin HEAD:feat/qms-platform-foundation
