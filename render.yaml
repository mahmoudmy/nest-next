services:
  - type: web
    name: qms-api
    runtime: node
    plan: starter
    branch: feat/qms-platform-foundation
    buildCommand: pnpm install --frozen-lockfile && pnpm db:generate && pnpm exec turbo build --filter=@qms/api
    preDeployCommand: pnpm db:deploy
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: qms-postgres
          property: connectionString
      - key: APP_ORIGIN
        sync: false
      - key: SESSION_TTL_SECONDS
        value: 28800
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

databases:
  - name: qms-postgres
    plan: starter
